<!DOCTYPE html>
<html>
  <head>
    <title>FloodXR</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
    
    <script>
      // using namespace std;

      AFRAME.registerComponent('drone-controller', {
        schema: { speed: { default: 0.07 } }, 
        init: function () {
          this.camera = document.querySelector('[camera]');
          this.lockedYaw = null; 
        },
        tick: function () {
          var look = this.camera ? this.camera.components['look-controls'] : null;

          var gamepads = navigator.getGamepads && navigator.getGamepads();
          if (!gamepads) return;

          for (var i = 0; i < gamepads.length; i++) {
            var gamepad = gamepads[i];
            if (gamepad) {
              var stickX = gamepad.axes[2]; 
              var stickY = gamepad.axes[3]; 

              if (Math.abs(stickY) > 0.4 && Math.abs(stickY) > Math.abs(stickX) * 2) {
                this.el.object3D.position.y -= stickY * this.data.speed;

                if (look && look.yawObject) {
                  if (this.lockedYaw === null) {
                     this.lockedYaw = look.yawObject.rotation.y; 
                  }
                  look.yawObject.rotation.y = this.lockedYaw; 
                }
              } else {
                this.lockedYaw = null;
              }
            }
          }
        }
      });
    </script>
  </head>
  <body style="background-color: black; margin: 0; overflow: hidden;">
    
    <a-scene>

        <a-asset-item id="house-model" src="assets/my_bedroom.glb"></a-asset-item>

      <a-entity id="rig" movement-controls="fly: true; speed: 0.25; rotationSpeed: 0.5" drone-controller position="10 9.6 -17">
        <a-entity camera position="0 0 0" look-controls>

          <a-plane id="fade-screen" color="#000000" width="10" height="10" position="0 0 -0.1" material="opacity: 0; transparent: true; depthTest: false"></a-plane>

            <a-text id="ui-torch" value="[ ] LOCATE TORCH" position="-1.1 -0.1 0" width="3.2" color="#777777" font="exo2bold"></a-text>

          </a-entity>

            <a-text value="GEAR ACQUIRED!" color="#39ff14" align="center" position="0 0.2 0" width="5" font="exo2bold"></a-text>
            <a-text value="PROCEED TO BASEMENT IMMEDIATELY" color="#ffffff" align="center" position="0 -0.2 0" width="3" font="exo2bold"></a-text>
          </a-entity>

          <a-entity id="basement-objective" position="0 -0.5 -1" scale="0.35 0.35 0.35" visible="false">
            <a-plane width="4" height="1.2" color="#001122" opacity="0.75" position="0 0 -0.01"></a-plane>
            <a-text id="objective-title" value="NEW DIRECTIVE" color="#00e5ff" align="center" position="0 0.2 0" width="4" font="exo2bold"></a-text>
            <a-text id="objective-text" value="FIND MAIN SWITCH & CUT POWER!" color="#ffffff" align="center" position="0 -0.2 0" width="4" font="exo2bold"></a-text>
          </a-entity>

          <a-entity id="timer-ui" position="0 0.6 -1" scale="0.4 0.4 0.4" visible="false">

            <a-text value="FATAL ERROR" color="#ff0000" align="center" position="0 0.4 0" width="7" font="exo2bold"></a-text>
            <a-text value="ELECTROCUTION DETECTED" color="#ff2a2a" align="center" position="0 0 0" width="8" font="exo2bold"></a-text>
            <a-text value="NEVER TOUCH WET LIVE SWITCHBOARDS BAREHANDED" color="#ffffff" align="center" position="0 -0.4 0" width="5" font="exo2bold"></a-text>
            <a-text value="REBOOTING SIMULATION..." color="#777777" align="center" position="0 -0.8 0" width="3" font="exo2bold"></a-text>

          <a-entity id="win-screen" position="0 0 -0.8" scale="0.5 0.5 0.5" visible="false">

            <a-text value="EVACUATION SUCCESSFUL" color="#39ff14" align="center" position="0 0.3 0" width="7" font="exo2bold"></a-text>
            <a-text value="SUBJECT SURVIVED" color="#ffffff" align="center" position="0 -0.2 0" width="4" font="exo2bold"></a-text>

      <a-entity id="bedroom-scene" visible="false">

        <a-box id="tv-trigger" class="clickable" position="14.687 9.235 -1.813" rotation="-11.596 -78.103 -1.114" scale="4.709 2.706 0.043" color="#FF0033" opacity="0.6">
          <a-text value="WATCH NEWS" align="center" position="0 0 0.1" scale="1 1 1" color="white" font="exo2bold"></a-text>
        </a-box>

        <a-video id="tv-screen" src="#scene2-video" position="14.687 9.235 -1.813" rotation="-6.139 -81.591 -0.284" width="6" height="3" scale="0.831 0.939 0.176" visible="false"></a-video>

        <a-entity id="item-spawner" visible="true">
          <a-gltf-model id="item-phone" src="#phone-asset" position="13.458 6.768 -7.852" rotation="-90 0 -90" scale="0.28 0.28 0.28"></a-gltf-model>
          <a-gltf-model id="item-torch" src="#torch-asset" position="16.600 8.845 -14.514" rotation="0 -68.016 0" scale="12 12 12"></a-gltf-model>
          <a-gltf-model id="item-firstaid" src="#firstaid-asset" position="-8.817 13.768 -14.858" rotation="-51.9 -92.983 1.203" scale="0.4 0.4 0.4"></a-gltf-model>
        </a-entity>

        <a-box id="basement-door" position="3.379 9.947 21.976" rotation="0 -180 0" scale="7.833 5.576 4.793" width="1.5" height="3" depth="0.1" color="#8B4513" opacity="0.2" visible="false">
          <a-text value="STARE TO ENTER\nBASEMENT" align="center" position="0 0 0.1" color="white" font="exo2bold"></a-text>
        </a-box>
      </a-entity>

      <a-entity id="basement-scene" visible="false">

        <a-gltf-model id="power-switch" src="#switch-asset" class="clickable" position="-0.726 1.816 52.977" rotation="0 -90 0" scale="0.005 0.005 0.005">
          <a-text value="MAIN POWER\nSTARE TO PULL" align="center" position="0 0.5 0" color="white" scale="0.5 0.5 0.5" font="exo2bold"></a-text>
        </a-gltf-model>

        <a-cylinder id="item-stick" radius="0.03" height="1.5" color="#5c4033" position="-3.542 -1.812 46.078" rotation="-31.938 -110.21 20.631" scale="2.049 3.574 1.325" visible="false"></a-cylinder>

        <a-plane id="flood-water" color="#0055ff" opacity="0.80" width="150" height="150" rotation="-90 0 0" position="-10.6 -4.1 47" visible="false"></a-plane>

        <a-box id="roof-door" position="-17.912 8.461 34.355" rotation="0 0.190 0" scale="2 4.025 0.1" color="#444" opacity="0.3" visible="false">
          <a-text value="ROOF ESCAPE\nSTARE TO OPEN" align="center" position="0 0 0.1" color="white" scale="0.8 0.8 0.8" font="exo2bold"></a-text>
        </a-box>

      </a-entity>

    </a-scene>

    <script>
      // using namespace std;

      const tvTrigger = document.querySelector('#tv-trigger');
      const tvScreen = document.querySelector('#tv-screen');
      const scene2Video = document.querySelector('#scene2-video');
      const emergencyAlert = document.querySelector('#emergency-alert');
      const itemSpawner = document.querySelector('#item-spawner');
      const checklistUI = document.querySelector('#checklist-ui');
      const successMessage = document.querySelector('#success-message');
      const phone = document.querySelector('#item-phone');
      const torch = document.querySelector('#item-torch');
      const firstaid = document.querySelector('#item-firstaid');
      const uiPhone = document.querySelector('#ui-phone');
      const uiTorch = document.querySelector('#ui-torch');
      const uiFirstaid = document.querySelector('#ui-firstaid');
      const bedroomScene = document.querySelector('#bedroom-scene');
      const basementDoor = document.querySelector('#basement-door');
      const basementScene = document.querySelector('#basement-scene');
      const rig = document.querySelector('#rig');
      
      const powerSwitch = document.querySelector('#power-switch');
      const itemStick = document.querySelector('#item-stick'); // NEW STICK
      
      const basementObjective = document.querySelector('#basement-objective');

      const ambientLight = document.querySelector('#ambient-light');
      const dirLight = document.querySelector('#directional-light');
      const playerFlashlight = document.querySelector('#player-flashlight');

      const floodWater = document.querySelector('#flood-water');
      const roofDoor = document.querySelector('#roof-door');
      const timerUI = document.querySelector('#timer-ui');
      const timerText = document.querySelector('#timer-text');
      const gameOverScreen = document.querySelector('#game-over-screen');
      const winScreen = document.querySelector('#win-screen');
      
      const floodWarning = document.querySelector('#flood-warning');

      // ELECTROCUTION ELEMENTS
      const flashScreen = document.querySelector('#flash-screen');
      const electrocutionScreen = document.querySelector('#electrocution-screen');
      const zapAudio = document.querySelector('#zap-audio');

      const underwaterOverlay = document.querySelector('#underwater-overlay');
      const cameraEl = document.querySelector('[camera]');
      let cameraWorldPos = new THREE.Vector3();

      const introVideo = document.querySelector('#intro-video');
      const introContainer = document.querySelector('#intro-container');
      const startBtn3D = document.querySelector('#start-btn-3d');
      const introVideoScreen = document.querySelector('#intro-video-screen');
      const turnAroundText = document.querySelector('#turn-around-text');

      // CHANGED: Added stick tracking to inventory
      let inventory = { phone: false, torch: false, firstaid: false, stick: false };

      let blackoutActive = false; 
      let isFlashlightOn = false;
      let lastButtonState = false; 

      let timeRemaining = 35;
      let floodInterval;
      let isGameOver = false;

      // -----------------------------------------------------------------
      // Unlocks browser audio safely
      // -----------------------------------------------------------------
      const unlockVideo = () => {
          scene2Video.load();
          introVideo.load();
          scene2Video.play().then(() => { scene2Video.pause(); scene2Video.currentTime = 0; }).catch(e => {});
          introVideo.play().then(() => { introVideo.pause(); introVideo.currentTime = 0; }).catch(e => {});
          window.removeEventListener('click', unlockVideo);
          window.removeEventListener('keydown', unlockVideo);
          window.removeEventListener('touchstart', unlockVideo);
      };
      window.addEventListener('click', unlockVideo);
      window.addEventListener('keydown', unlockVideo);
      window.addEventListener('touchstart', unlockVideo);

      // --- PHASE 0: 3D GAZE INTRO SEQUENCE ---
      startBtn3D.addEventListener('click', () => {
          startBtn3D.querySelector('a-text').setAttribute('value', 'LOADING...');
          startBtn3D.classList.remove('clickable');
          
          introVideo.play().catch(e => console.error("Intro video play failed:", e));

          introVideo.addEventListener('timeupdate', () => {
              startBtn3D.setAttribute('visible', 'false'); 
              introVideoScreen.setAttribute('visible', 'true'); 
          }, { once: true });
      });

      introVideo.addEventListener('ended', () => {
          introContainer.setAttribute('visible', 'false'); 
          turnAroundText.setAttribute('visible', 'false'); 
          bedroomScene.setAttribute('visible', 'true');    
      });

      // --- PHASE 1: THE TV VIDEO ---
      tvTrigger.addEventListener('click', () => {
        tvTrigger.querySelector('a-text').setAttribute('value', 'LOADING...');
        tvTrigger.classList.remove('clickable'); 
        
        scene2Video.muted = false; 
        scene2Video.play().catch(err => console.error("Video blocked by browser", err));

        scene2Video.addEventListener('timeupdate', () => {
            tvTrigger.setAttribute('visible', 'false'); 
            tvScreen.setAttribute('visible', 'true');
        }, { once: true });
      });

      // --- PHASE 2: THE ALERT & SPAWN ---
      scene2Video.addEventListener('ended', () => {
        tvScreen.setAttribute('visible', 'false');
        emergencyAlert.setAttribute('visible', 'true');
        setTimeout(() => {
            emergencyAlert.setAttribute('visible', 'false');
            checklistUI.setAttribute('visible', 'true');
            itemSpawner.setAttribute('visible', 'true');
            phone.classList.add('clickable');
            torch.classList.add('clickable');
            firstaid.classList.add('clickable');
        }, 4000);
      });

      // --- PHASE 3: COLLECTION LOGIC ---
      function updateChecklist() {
        if (inventory.phone) { uiPhone.setAttribute('value', '[ACQUIRED] PHONE'); uiPhone.setAttribute('color', '#39ff14'); }
        if (inventory.torch) { uiTorch.setAttribute('value', '[ACQUIRED] TORCH'); uiTorch.setAttribute('color', '#39ff14'); }
        if (inventory.firstaid) { uiFirstaid.setAttribute('value', '[ACQUIRED] FIRST AID'); uiFirstaid.setAttribute('color', '#39ff14'); }

        if (inventory.phone && inventory.torch && inventory.firstaid) {
          checklistUI.setAttribute('visible', 'false');
          successMessage.setAttribute('visible', 'true');
          basementDoor.setAttribute('visible', 'true');
          basementDoor.classList.add('clickable');
          setTimeout(() => { successMessage.setAttribute('visible', 'false'); }, 4000);
        }
      }

      phone.addEventListener('click', () => { inventory.phone = true; phone.setAttribute('visible', 'false'); phone.classList.remove('clickable'); updateChecklist(); });
      torch.addEventListener('click', () => { inventory.torch = true; torch.setAttribute('visible', 'false'); torch.classList.remove('clickable'); updateChecklist(); });
      firstaid.addEventListener('click', () => { inventory.firstaid = true; firstaid.setAttribute('visible', 'false'); firstaid.classList.remove('clickable'); updateChecklist(); });

      // --- PHASE 4: LEVEL TRANSITION ---
      const fadeScreen = document.querySelector('#fade-screen'); 
      basementDoor.addEventListener('click', () => {
        fadeScreen.setAttribute('animation', 'property: material.opacity; from: 0; to: 1; dur: 1000; easing: linear');
        setTimeout(() => {
            bedroomScene.setAttribute('visible', 'false');
            basementScene.setAttribute('visible', 'true');
            rig.setAttribute('position', '-17.957 8.060 34.629');
            rig.setAttribute('rotation', '0 0 0'); 
            inBasement = true;
            
            // CHANGED: Enable Switch and Stick, Update Objective
            powerSwitch.classList.add('clickable');
            itemStick.setAttribute('visible', 'true');
            itemStick.classList.add('clickable');
            
            basementObjective.querySelector('#objective-text').setAttribute('value', 'WARNING: HIGH VOLTAGE\nFIND WOODEN STICK TO CUT POWER!');
            basementObjective.setAttribute('visible', 'true');
            
            fadeScreen.setAttribute('animation', 'property: material.opacity; from: 1; to: 0; dur: 1000; easing: linear');
        }, 1000); 
      });

      // --- NEW PHASE: PICK UP WOODEN STICK ---
      itemStick.addEventListener('click', () => {
          inventory.stick = true;
          itemStick.setAttribute('visible', 'false');
          itemStick.classList.remove('clickable');
          
          basementObjective.querySelector('#objective-text').setAttribute('value', '[ACQUIRED] WOODEN INSULATOR\nSAFELY CUT MAIN POWER!');
          basementObjective.querySelector('#objective-text').setAttribute('color', '#39ff14');
      });


      // --- PHASE 5: THE SWITCH LOGIC & ELECTROCUTION TRAP ---
      powerSwitch.addEventListener('click', () => {
        
        // NEW: FATAL SHOCK CHECK
        if (!inventory.stick) {
            triggerElectrocution();
            return; // Stops the rest of the code from running!
        }

        // IF SAFE (Has Stick): Continue normal flood sequence
        powerSwitch.setAttribute('animation-mixer', 'clip: *; loop: once; clampWhenFinished: true');
        powerSwitch.classList.remove('clickable');
        
        ambientLight.setAttribute('animation', 'property: light.intensity; to: 0.02; dur: 1500; easing: linear');
        dirLight.setAttribute('animation', 'property: light.intensity; to: 0.0; dur: 1500; easing: linear');

        basementObjective.setAttribute('visible', 'false');

        setTimeout(() => {
            blackoutActive = true; 
            
            floodWarning.setAttribute('visible', 'true');
            
            setTimeout(() => {
                floodWarning.setAttribute('visible', 'false'); 
                startFloodSequence();
            }, 5000);

        }, 1500);
      });

      // --- NEW: FATAL SHOCK SEQUENCE ---
      function triggerElectrocution() {
          if (isGameOver) return;
          isGameOver = true;
          
          // Play loud zap sound if you added zap.mp3 to assets folder
          zapAudio.volume = 1.0;
          zapAudio.play().catch(e => console.log("Zap audio not found or blocked"));

          // Instant white flashbang
          flashScreen.setAttribute('visible', 'true');
          flashScreen.setAttribute('material', 'opacity: 1');
          
          // Quickly fade flashbang out and reveal death screen
          setTimeout(() => {
              flashScreen.setAttribute('material', 'opacity: 0');
              electrocutionScreen.setAttribute('visible', 'true'); 
              
              // Force reload after 3.5 seconds
              setTimeout(() => { location.reload(); }, 3500);
          }, 150);
      }


      // --- PHASE 6: THE FLOOD SEQUENCE ---
      function startFloodSequence() {
          if (isGameOver) return;
          timerUI.setAttribute('visible', 'true');

          floodWater.setAttribute('visible', 'true');
          floodWater.setAttribute('animation', 'property: position; from: -10.6 -4.1 47; to: -10.6 10.0 47; dur: 35000; easing: linear');

          roofDoor.setAttribute('visible', 'true');
          roofDoor.classList.add('clickable');

          floodInterval = setInterval(() => {
              if (timeRemaining > 0) timeRemaining--;
              timerText.setAttribute('value', `T-MINUS: ${timeRemaining}s`);
              if (timeRemaining <= 0) { triggerDeath(); }
          }, 1000);
      }

      function triggerDeath() {
          if (isGameOver) return;
          clearInterval(floodInterval);
          isGameOver = true;
          
          floodWater.removeAttribute('animation'); 
          roofDoor.classList.remove('clickable');

          setTimeout(() => {
              gameOverScreen.setAttribute('visible', 'true'); 
              setTimeout(() => { location.reload(); }, 3000);
          }, 1000);
      }

      // --- PHASE 7: ESCAPE LOGIC ---
      roofDoor.addEventListener('click', () => {
          if (isGameOver) return;
          clearInterval(floodInterval);
          isGameOver = true;
          timerUI.setAttribute('visible', 'false');
          roofDoor.classList.remove('clickable');
          winScreen.setAttribute('visible', 'true');
      });

      window.addEventListener('keydown', (e) => {
          if (e.key.toLowerCase() === 'k' && blackoutActive && !isGameOver) {
              isFlashlightOn = !isFlashlightOn;
              playerFlashlight.setAttribute('animation', `property: light.intensity; to: ${isFlashlightOn ? 1.5 : 0}; dur: 100`);
          }
      });

      // ==========================================
      // --- MASTER GAME LOOP ---
      // ==========================================
      const footstepsAudio = document.querySelector('#footsteps-audio');
      let inBasement = false; 
      const bounds = {
          bedroom:  { minX: -8.6  , maxX: 15.5, minZ: -21.6, maxZ: 20.780 },
          basement: { minX: -20.431, maxX: -1.028, minZ: 33.224, maxZ: 67.3 }
      };

      let lastX = 10; 
      let lastZ = -17; 

      function gameLoop() {
          let pos = rig.object3D.position; 
          let currentRoom = inBasement ? bounds.basement : bounds.bedroom;

          if (pos.x < currentRoom.minX) pos.x = currentRoom.minX;
          if (pos.x > currentRoom.maxX) pos.x = currentRoom.maxX;
          if (pos.z < currentRoom.minZ) pos.z = currentRoom.minZ;
          if (pos.z > currentRoom.maxZ) pos.z = currentRoom.maxZ;

          let movedX = Math.abs(pos.x - lastX);
          let movedZ = Math.abs(pos.z - lastZ);

          if (movedX > 0.005 || movedZ > 0.005) {
              if (footstepsAudio.paused) {
                  footstepsAudio.volume = 0.5;
                  let playPromise = footstepsAudio.play();
                  if (playPromise !== undefined) { playPromise.catch(error => {}); }
              }
          } else {
              if (!footstepsAudio.paused) { footstepsAudio.pause(); }
          }

          let gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
          for (let i = 0; i < gamepads.length; i++) {
              let gp = gamepads[i];
              if (gp) {
                  let currentButtonState = gp.buttons[1] ? gp.buttons[1].pressed : false;
                  
                  if (currentButtonState && !lastButtonState && blackoutActive && !isGameOver) {
                      isFlashlightOn = !isFlashlightOn; 
                      playerFlashlight.setAttribute('animation', `property: light.intensity; to: ${isFlashlightOn ? 1.5 : 0}; dur: 100`);
                  }
                  lastButtonState = currentButtonState; 
              }
          }

          if (inBasement && floodWater.getAttribute('visible') === true && !isGameOver) {
              cameraEl.object3D.getWorldPosition(cameraWorldPos);
              let eyeHeight = cameraWorldPos.y;
              let waterHeight = floodWater.object3D.position.y;

              if (waterHeight > eyeHeight - 0.1) {
                  underwaterOverlay.setAttribute('visible', 'true');
                  underwaterOverlay.setAttribute('material', 'opacity: 0.85');
                  
                  triggerDeath(); 
              } else {
                  underwaterOverlay.setAttribute('visible', 'false');
              }
          }

          lastX = pos.x;
          lastZ = pos.z;
          requestAnimationFrame(gameLoop); 
      }
      
      gameLoop(); 
    </script>
  </body>
</html>
